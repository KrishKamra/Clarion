# Launcher icons, generated from the sources in assets/brand/icon/.
# Regenerate after changing them: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/icon/icon.png
  min_sdk_android: 21
  # Adaptive icon (Android 8+): the lens floats over the ink canvas.
  adaptive_icon_background: assets/brand/icon/icon_background.png
  adaptive_icon_foreground: assets/brand/icon/icon_foreground.png
  # The sources already sit inside the 66 % safe zone; no extra inset.
  adaptive_icon_foreground_inset: 0
  # Themed icon (Android 13+): tinted to match the wallpaper.
  adaptive_icon_monochrome: assets/brand/icon/icon_monochrome.png
  web:
    generate: true
    image_path: assets/brand/icon/icon.png
    background_color: "#0A0C14"
    theme_color: "#6A3C82"
