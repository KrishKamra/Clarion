<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Clarion">
  <title>Clarion</title>
  <defs>
    <!-- The lens coating. Light falls from the top-left, as on every Clarion
         surface: champagne where it catches the rim, deepening into plum. -->
    <linearGradient id="ring" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAE0CF"/>
      <stop offset="0.42" stop-color="#B07CC4"/>
      <stop offset="1" stop-color="#6A3C82"/>
    </linearGradient>
    <!-- A faint pool of plum inside the lens, so it reads as glass. -->
    <radialGradient id="glass" cx="26" cy="24" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B07CC4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#B07CC4" stop-opacity="0"/>
    </radialGradient>
    <!-- The focal point — what you are actually looking for. Matte, lit
         from the same top-left as the ring: precision, not gloss. -->
    <linearGradient id="focus" x1="34" y1="16" x2="48" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C79AD8"/>
      <stop offset="1" stop-color="#6A3C82"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="26" fill="url(#glass)"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#ring)" stroke-width="4.5"/>
  <circle cx="41" cy="23" r="8.25" fill="url(#focus)"/>
</svg>
